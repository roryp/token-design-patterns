<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">The AI Credit Economic Framework: a three-part VS Code and GitHub Copilot video series</title>
  <desc id="description">Episode one covers saving AI credits with model choice, Auto selection, and thinking effort. Episode two covers compaction, the Cache Explorer, and smarter context. Episode three covers design patterns, custom agents, model routing, and the Copilot SDK. The three episodes map to spending less per request, per session, and per system.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050d1b"/>
      <stop offset="0.5" stop-color="#0b1c33"/>
      <stop offset="1" stop-color="#060f1f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#132844" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0c1a2e" stop-opacity="0.96"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLime" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#01060f" flood-opacity="0.55"/>
    </filter>
    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#f472b6" flood-opacity="0.75"/>
    </filter>
    <style><![CDATA[
      text { font-family: "Segoe UI", Aptos, Calibri, Arial, sans-serif; }
      .kicker { fill: #22d3ee; font-size: 17px; font-weight: 800; letter-spacing: 5.5px; }
      .h1 { font-size: 72px; font-weight: 900; letter-spacing: -1px; }
      .pill-text { font-size: 12.5px; font-weight: 900; letter-spacing: 2.4px; }
      .ep-num { font-size: 92px; font-weight: 900; text-anchor: end; }
      .card-h { font-size: 33px; font-weight: 900; letter-spacing: -0.4px; }
      .bullet { fill: #dce7f5; font-size: 18px; font-weight: 650; }
      .marker { font-size: 18px; font-weight: 900; }
      .frame-lead { font-size: 15px; font-weight: 850; letter-spacing: 0.6px; }
      .frame-body { fill: #93a7bf; font-size: 14.5px; font-weight: 600; }
      .footer { fill: #8ea6c0; font-size: 18px; font-weight: 750; letter-spacing: 0.9px; }
      .footer-mark { fill: #22d3ee; font-size: 18px; font-weight: 900; letter-spacing: 2.2px; text-anchor: end; }
      .badge-text { fill: #ffffff; font-weight: 900; text-anchor: middle; }
    ]]></style>
  </defs>

  <rect width="1600" height="900" fill="url(#pageBg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="180" cy="120" rx="620" ry="440" fill="url(#glowCyan)"/>
  <ellipse cx="1420" cy="250" rx="560" ry="420" fill="url(#glowPink)"/>
  <ellipse cx="720" cy="880" rx="700" ry="360" fill="url(#glowLime)"/>

  <g opacity="0.85">
    <rect x="-160" y="286" width="1900" height="3" fill="url(#streak)" transform="rotate(-4 800 286)"/>
    <rect x="-160" y="306" width="1900" height="1.5" fill="url(#streak)" transform="rotate(-4 800 306)"/>
    <rect x="-160" y="60" width="1900" height="2" fill="url(#streak)" opacity="0.5" transform="rotate(-4 800 60)"/>
    <rect x="-160" y="790" width="1900" height="2" fill="url(#streak)" opacity="0.45" transform="rotate(-4 800 790)"/>
  </g>

  <text class="kicker" x="90" y="92">3-PART SERIES  ·  VS CODE  +  GITHUB COPILOT</text>
  <text class="h1" x="90" y="176" fill="#ffffff">THE AI CREDIT</text>
  <text class="h1" x="90" y="252" fill="url(#titleGrad)">ECONOMIC FRAMEWORK</text>

  <g transform="rotate(-4 1330 168)" filter="url(#cardShadow)">
    <rect x="1108" y="86" width="444" height="164" rx="20" fill="url(#badgeFill)"/>
    <g filter="url(#boltGlow)">
      <path d="M1168 112L1128 176h30l-14 52 46-70h-32l22-46z" fill="#ffffff"/>
    </g>
    <text class="badge-text" x="1360" y="150" font-size="42">SPEND LESS.</text>
    <text class="badge-text" x="1360" y="204" font-size="42">SHIP MORE.</text>
  </g>

  <!-- Episode 1 -->
  <g filter="url(#cardShadow)">
    <rect x="90" y="320" width="446" height="442" rx="22" fill="url(#cardFill)" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M112 320h402a22 22 0 0 1 22 22v0H90v0a22 22 0 0 1 22-22z" fill="#22d3ee"/>
    <rect x="90" y="336" width="446" height="7" fill="#22d3ee"/>
  </g>
  <text class="ep-num" x="512" y="432" fill="#22d3ee" fill-opacity="0.20">01</text>
  <rect x="120" y="374" width="152" height="28" rx="14" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-opacity="0.55"/>
  <text class="pill-text" x="138" y="393" fill="#22d3ee">PER REQUEST</text>
  <text class="card-h" x="120" y="452" fill="#ffffff">SAVE AI CREDITS</text>
  <text class="card-h" x="120" y="490" fill="#22d3ee">IN VS CODE</text>
  <rect x="120" y="512" width="72" height="5" rx="2.5" fill="#22d3ee"/>
  <g>
    <text class="marker" x="120" y="562" fill="#22d3ee">&#9656;</text>
    <text class="bullet" x="146" y="562">Model choice</text>
    <text class="marker" x="120" y="604" fill="#22d3ee">&#9656;</text>
    <text class="bullet" x="146" y="604">Auto selection</text>
    <text class="marker" x="120" y="646" fill="#22d3ee">&#9656;</text>
    <text class="bullet" x="146" y="646">Thinking effort</text>
  </g>
  <text class="frame-lead" x="120" y="702" fill="#22d3ee">SPEND LESS PER REQUEST</text>
  <text class="frame-body" x="120" y="726">Pick the cheapest model that still</text>
  <text class="frame-body" x="120" y="746">finishes the job.</text>

  <!-- Episode 2 -->
  <g filter="url(#cardShadow)">
    <rect x="576" y="320" width="446" height="442" rx="22" fill="url(#cardFill)" stroke="#f472b6" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M598 320h402a22 22 0 0 1 22 22v0H576v0a22 22 0 0 1 22-22z" fill="#f472b6"/>
    <rect x="576" y="336" width="446" height="7" fill="#f472b6"/>
  </g>
  <text class="ep-num" x="998" y="432" fill="#f472b6" fill-opacity="0.20">02</text>
  <rect x="606" y="374" width="148" height="28" rx="14" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.55"/>
  <text class="pill-text" x="624" y="393" fill="#f472b6">PER SESSION</text>
  <text class="card-h" x="606" y="452" fill="#ffffff">SUPERCHARGE</text>
  <text class="card-h" x="606" y="490" fill="#f472b6">VS CODE COPILOT</text>
  <rect x="606" y="512" width="72" height="5" rx="2.5" fill="#f472b6"/>
  <g>
    <text class="marker" x="606" y="562" fill="#f472b6">&#9656;</text>
    <text class="bullet" x="632" y="562">Compaction</text>
    <text class="marker" x="606" y="604" fill="#f472b6">&#9656;</text>
    <text class="bullet" x="632" y="604">Cache Explorer</text>
    <text class="marker" x="606" y="646" fill="#f472b6">&#9656;</text>
    <text class="bullet" x="632" y="646">Smarter context</text>
  </g>
  <text class="frame-lead" x="606" y="702" fill="#f472b6">SPEND LESS PER SESSION</text>
  <text class="frame-body" x="606" y="726">Keep the context small and the</text>
  <text class="frame-body" x="606" y="746">prompt cache warm.</text>

  <!-- Episode 3 -->
  <g filter="url(#cardShadow)">
    <rect x="1062" y="320" width="446" height="442" rx="22" fill="url(#cardFill)" stroke="#a3e635" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M1084 320h402a22 22 0 0 1 22 22v0h-446v0a22 22 0 0 1 22-22z" fill="#a3e635"/>
    <rect x="1062" y="336" width="446" height="7" fill="#a3e635"/>
  </g>
  <text class="ep-num" x="1484" y="432" fill="#a3e635" fill-opacity="0.20">03</text>
  <rect x="1092" y="374" width="142" height="28" rx="14" fill="#a3e635" fill-opacity="0.16" stroke="#a3e635" stroke-opacity="0.55"/>
  <text class="pill-text" x="1110" y="393" fill="#a3e635">PER SYSTEM</text>
  <text class="card-h" x="1092" y="452" fill="#ffffff">BUILD COST-EFFICIENT</text>
  <text class="card-h" x="1092" y="490" fill="#a3e635">AI WORKFLOWS</text>
  <rect x="1092" y="512" width="72" height="5" rx="2.5" fill="#a3e635"/>
  <g>
    <text class="marker" x="1092" y="562" fill="#a3e635">&#9656;</text>
    <text class="bullet" x="1118" y="562">Design patterns</text>
    <text class="marker" x="1092" y="604" fill="#a3e635">&#9656;</text>
    <text class="bullet" x="1118" y="604">Custom agents + routing</text>
    <text class="marker" x="1092" y="646" fill="#a3e635">&#9656;</text>
    <text class="bullet" x="1118" y="646">The Copilot SDK</text>
  </g>
  <text class="frame-lead" x="1092" y="702" fill="#a3e635">SPEND LESS PER SYSTEM</text>
  <text class="frame-body" x="1092" y="726">Route work so the expensive</text>
  <text class="frame-body" x="1092" y="746">model runs least.</text>

  <line x1="90" y1="812" x2="1510" y2="812" stroke="#1e3a5f" stroke-width="1.5"/>
  <text class="footer" x="90" y="858">EVERY CREDIT IS DECIDED AT ONE OF THREE LAYERS &#8212; REQUEST, SESSION, SYSTEM.</text>
  <text class="footer-mark" x="1510" y="858">TOKENFLOW LAB</text>
</svg>
